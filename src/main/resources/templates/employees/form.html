<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title th:text="${pageTitle}">Employee Form</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}" />
</head>
<body>

<div th:replace="~{layout :: header}"></div>

<h2 th:text="${pageTitle}">Employee Form</h2>

<!-- 
    th:object binds this <form> to the "employee" model attribute.
    th:field="*{firstName}" then binds each input to employee.firstName.
    th:action chooses POST URL based on whether it's an edit or a new employee.
-->
<form th:action="@{/employees}" th:object="${employee}" method="post">

    <!-- Hidden ID — empty for new, populated for edit -->
    <input type="hidden" th:field="*{id}" />

    <div class="form-row">
        <label>First Name *</label>
        <input type="text" th:field="*{firstName}" />
        <span class="error" th:if="${#fields.hasErrors('firstName')}"
              th:errors="*{firstName}"></span>
    </div>

    <div class="form-row">
        <label>Last Name *</label>
        <input type="text" th:field="*{lastName}" />
        <span class="error" th:if="${#fields.hasErrors('lastName')}"
              th:errors="*{lastName}"></span>
    </div>

    <div class="form-row">
        <label>Date of Birth *</label>
        <input type="date" th:field="*{dateOfBirth}" />
        <span class="error" th:if="${#fields.hasErrors('dateOfBirth')}"
              th:errors="*{dateOfBirth}"></span>
    </div>

    <div class="form-row">
        <label>Department *</label>
        <select th:field="*{department}">
            <option value="">-- Select --</option>
            <option th:each="dept : ${departments}"
                    th:value="${dept}"
                    th:text="${dept}">
            </option>
        </select>
        <span class="error" th:if="${#fields.hasErrors('department')}"
              th:errors="*{department}"></span>
    </div>

    <div class="form-row">
        <label>Salary *</label>
        <input type="number" step="0.01" th:field="*{salary}" />
        <span class="error" th:if="${#fields.hasErrors('salary')}"
              th:errors="*{salary}"></span>
    </div>

    <div class="form-row">
        <label>Manager</label>
        <select th:field="*{manager}">
            <option value="">-- No manager --</option>
            <option th:each="mgr : ${managers}"
                    th:value="${mgr.id}"
                    th:text="${mgr.firstName + ' ' + mgr.lastName}">
            </option>
        </select>
    </div>

    <div class="form-actions">
        <button type="submit">Save</button>
        <a th:href="@{/employees}">Cancel</a>
    </div>
</form>

</body>
</html>
