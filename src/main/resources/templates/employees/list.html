<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Employee Listing</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}" />
</head>
<body>

<div th:replace="~{layout :: header}"></div>

<h2>Employee Listing</h2>


<p th:if="${#lists.isEmpty(employees)}" class="empty-message">
    No employees yet.
</p>

<table th:unless="${#lists.isEmpty(employees)}" class="employee-table">
    <thead>
    <tr>
        <th>ID</th>
        <th>First Name</th>
        <th>Last Name</th>
        <th>Date of Birth</th>
        <th>Department</th>
        <th>Salary</th>
        <th>Manager</th>
        <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="emp : ${employees}">
        <td th:text="${emp.id}">1</td>
        <td th:text="${emp.firstName}">John</td>
        <td th:text="${emp.lastName}">Doe</td>
        <td th:text="${emp.dateOfBirth}">1990-01-01</td>
        <td th:text="${emp.department}">IT</td>
        <td th:text="${emp.salary}">50000</td>
        <td th:text="${emp.manager != null 
                       ? emp.manager.firstName + ' ' + emp.manager.lastName 
                       : '—'}">Manager Name</td>
        <td>
            <a th:href="@{/employees/{id}(id=${emp.id})}">View</a> |
            <a th:href="@{/employees/{id}/edit(id=${emp.id})}">Edit</a>
        </td>
    </tr>
    </tbody>
</table>

</body>
</html>
